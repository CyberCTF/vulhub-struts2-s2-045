# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# Struts2 S2-045 (CVE-2017-5638) (Vulhub, by phith0n and the Vulhub contributors) as an Isoloom spec:
# Vulhub's struts2/s2-045, vendored in app/, run from the published image vulhub/struts2:2.3.30.
# `isoloom generate`, then `isoloom run docker`.
version: 1
name: vulhub-struts2-s2-045

# Given by the CyberCTF launcher: this player's flag. Without it the development flag.
inputs:
  CTF_FLAG_MAIN: {}

networks:
  lab: {cidr: 10.60.42.0/24, internet: false}

machines:
  struts2:
    networks: {lab: 10}
    resources: {cpus: 1, memory_mb: 1024}
    volumes: {ctf: /ctf}     # the flag, written by ctf/flag.sh at every start
    ports:
      web:
        port: 8080
        protocol: http
        publish: true
    files:
      - path: /run/lab/ctf_flag_main
        input: CTF_FLAG_MAIN
    setup:
      - ctf/flag.sh
    app:
      image: vulhub/struts2:2.3.30

checks:
  - name: the upload application answers
    http: http://struts2:8080/
    wait: 240
  - name: the Struts upload action is served
    script: checks/upload.sh
    wait: 60

message: |
  The Struts 2.3.30 upload application answers at {{ machines.struts2.ports.web.url }}.
  Uploads go through the Jakarta multipart parser: look at what it does with a bad Content-Type.
